<!doctype html>
<html lang="pt">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mORA</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="56x56" href="icons/icon-56.png">
  <link rel="apple-touch-icon" href="icons/icon-112.png">
  <meta name="theme-color" content="#1a7a3c">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  <header id="header">
    <div id="header-top">
      <button id="nav-prev" type="button" aria-label="Dia anterior">‹</button>
      <div id="date-line"></div>
      <button id="nav-next" type="button" aria-label="Dia seguinte">›</button>
    </div>
  </header>

  <div id="banner" class="hidden"></div>

  <main id="content"></main>

  <!-- Overlay used for the options menu, the hour chooser and confirmations. -->
  <div id="overlay" class="hidden">
    <div id="overlay-box">
      <div id="overlay-title"></div>
      <ul id="overlay-list"></ul>
    </div>
  </div>

  <footer id="softkeys">
    <span id="sk-left"></span>
    <span id="sk-center"></span>
    <span id="sk-right"></span>
  </footer>

  <!-- Plain scripts, no modules: Gecko 48 has no ES-module support, and the
       privileged-app CSP forbids inline scripts. Order matters. -->
  <script src="js/liturgy.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
